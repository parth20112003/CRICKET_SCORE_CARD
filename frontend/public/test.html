<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cricinfo: "#03a9f4",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl m-4">
    <div class="md:flex">
      <div class="md:shrink-0">
        <div class="h-48 w-full bg-cricinfo md:h-full md:w-48 flex items-center justify-center text-white text-4xl font-bold">
          CS
        </div>
      </div>
      <div class="p-8">
        <div class="uppercase tracking-wide text-sm text-cricinfo font-semibold">Cricket Scorecard</div>
        <a href="#" class="block mt-1 text-lg leading-tight font-medium text-black hover:underline">Tailwind CSS Test Page</a>
        <p class="mt-2 text-gray-500">This is a simple test page to verify that Tailwind CSS is working correctly. If you can see this styled content with blue accents and proper layout, Tailwind CSS is working!</p>
        <div class="mt-4">
          <button class="bg-cricinfo hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Test Button
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
